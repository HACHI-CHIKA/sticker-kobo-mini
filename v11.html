<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スタンプ工房 mini v11</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;overscroll-behavior:none;font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif;color:#26283b;background:#f6f6fb}button,input,select{font:inherit}button{border:0;border-radius:10px;background:#e9edff;color:#264f9e;font-weight:700;padding:9px;touch-action:manipulation}button.active{background:#285fba;color:#fff}header{height:46px;display:flex;align-items:center;justify-content:space-between;padding:5px 12px;gap:8px}header b{font-size:17px}header button{font-size:12px;padding:8px 10px}.app{height:100dvh;display:flex;flex-direction:column;overflow:hidden}.stage-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:4px 12px;overflow:hidden;touch-action:none}.stage{width:min(100%,calc(100dvh - 385px),540px);aspect-ratio:1;min-width:0;position:relative;touch-action:none;overflow:hidden;border-radius:12px;box-shadow:0 2px 12px #0001;background:repeating-conic-gradient(#dfe1e8 0 25%,#fff 0 50%) 50%/22px 22px}canvas{width:100%;height:100%;display:block;touch-action:none}.controls{height:326px;flex:none;background:white;border-radius:18px 18px 0 0;box-shadow:0 -2px 12px #0001;padding:9px 12px calc(8px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;min-height:0}.tabs,.row{display:flex;gap:6px;align-items:center}.tabs button{flex:1;font-size:13px}.tools{overflow:auto;min-height:0;flex:1;overscroll-behavior:contain}.group{display:grid;grid-template-columns:1fr 1fr;gap:7px}.group>*{min-width:0}label{font-size:12px;font-weight:700;display:block;margin:4px 0}input:not([type=checkbox]),select{width:100%;min-height:37px;border:1px solid #cdd2e1;border-radius:8px;background:white;padding:6px;color:#222}input[type=range]{padding:0}input[type=color]{height:38px;padding:2px}.wide{grid-column:1/-1}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.buttons button{font-size:12px;padding:8px 2px}.bottom{display:flex;gap:7px}. </style></head><body><div class="app"><header><b>スタンプ工房 mini v11</b><button id="centerView">画面を中央に戻す</button></header><div class="stage-wrap" id="wrap"><div class="stage" id="stage"><canvas id="canvas" width="512" height="512"></canvas></div></div><section class="controls"><div class="quick-size"><label for="quickSize">文字サイズ <output id="quickSizeOut">50</output></label><input id="quickSize" type="range" min="18" max="180" value="50"><button id="quickText">文字を移動</button></div><div class="tabs"><button data-tab="image" class="active">イラスト</button><button data-tab="text">文字</button><button data-tab="look">文字装飾</button><button data-tab="move">移動・保存</button><button data-tab="command">／コマンド</button></div><div id="status">画像を選択してください</div><div class="tools">
<div id="panel-image" class="group"><div class="wide"><label>画像を読み込む（透過PNG推奨）</label><input id="file" type="file" accept="image/*"></div><div class="wide"><label>イラストの大きさ <output id="scaleOut">75%</output></label><input id="scale" type="range" min="10" max="250" value="75"></div><button id="imageReset">イラストを中央へ</button><button id="selectImage">イラストを動かす</button><div class="wide note">画像を指で動かす／2本指で拡大縮小。枠外にはみ出してもOK。文字と重ねられます。</div></div>
<div id="panel-text" class="group hidden"><div class="wide"><label>表示する文字</label><input id="phrase" value="ありがとう" maxlength="24"></div><div><label>文字の方向</label><select id="layout"><option value="vr">縦書き（右）</option><option value="vl">縦書き（左）</option><option value="h">横書き</option></select></div><div><label>角度 <output id="angleOut">0°</output></label><input id="angle" type="range" min="-90" max="90" value="0"></div><div class="wide"><label>文字の大きさ <output id="sizeOut">50</output></label><input id="size" type="range" min="18" max="180" value="50"></div><button id="textReset">文字を初期位置へ</button><button id="selectText">文字を動かす</button></div>
<div id="panel-look" class="group hidden"><div class="wide"><label>文字デザイン</label><select id="style"><option value="puffy">ぷくぷくシール</option><option value="candy">キャンディツヤ</option><option value="bold">極太まる文字</option><option value="soft">やさしいパステル</option><option value="outline">くっきり縁取り</option><option value="brush">筆文字風</option><option value="plain">シンプル</option></select></div><div><label>色のつけ方</label><select id="palette"><option value="single">単色</option><option value="pastel">1文字ずつパステル</option><option value="alternate">2色交互</option><option value="rainbow">虹色パステル</option></select></div><div><label>基本色</label><input id="color" type="color" value="#f5a4c6"></div><div><label>縁の太さ <output id="edgeOut">3</output></label><input id="edge" type="range" min="0" max="10" value="3"></div><div><label>2色目</label><input id="color2" type="color" value="#ffe08a"></div><div class="wide"><label class="gloss-toggle"><input id="gloss" type="checkbox" checked> 控えめなツヤを入れる（オフで元の色そのまま）</label></div><div class="wide note">文字の上に白い文字を重ねず、色を保つグラデーションでツヤを表現します。ツヤなしも選べます。</div></div>
<div id="panel-command" class="group hidden"><div class="wide"><label>／コマンドで編集</label><input id="command" type="text" autocomplete="off" autocapitalize="off" placeholder="例：/文字 ピンク 縦 80"></div><button id="runCommand" class="wide command-go">コマンドを実行</button><div class="wide"><label>よく使うコマンド（タップで入力）</label><div class="command-examples"><button type="button" data-example="/文字 ピンク 縦 80">ピンク縦書き</button><button type="button" data-example="/文字 虹色 ぷくぷく">虹色ぷくぷく</button><button type="button" data-example="/文字 単色 ツヤなし">単色・ツヤなし</button><button type="button" data-example="/画質 1024">1024px</button><button type="button" data-example="/画像 120">画像120%</button><button type="button" data-example="/配置 文字 右 20">文字を右へ</button><button type="button" data-example="/保存">PNG保存</button><button type="button" data-example="/ヘルプ">使い方</button></div></div><div id="commandResult" class="wide command-result" aria-live="polite">日本語の決まったコマンドを認識します。AIによる画像生成ではありません。</div><div class="wide note">例：/文字 青 横 100、/画質 512、/画像 150、/配置 イラスト 左 20、/文字 ありがとう</div></div>
<div id="panel-move" class="group hidden"><div class="wide"><label>指で動かす対象</label><select id="target"><option value="image">イラスト</option><option value="text">文字</option><option value="view">編集画面全体</option></select></div><div class="buttons wide"><button data-nudge="0,-10">↑</button><button data-nudge="0,10">↓</button><button data-nudge="-10,0">←</button><button data-nudge="10,0">→</button></div><button id="undo">↶ 取り消し</button><button id="resetAll">配置をリセット</button><div class="wide"><label>PNGの保存サイズ</label><select id="exportSize"><option value="512">512 × 512</option><option value="1024">1024 × 1024</option><option value="2048">2048 × 2048</option></select></div><div class="wide note">編集枠内のどこを触っても、選択した対象をスライドできます。画面全体の移動・ズームは保存画像には反映されません。</div></div>
</div><div class="bottom"><button id="toggleTarget">操作：イラスト</button><button id="export" class="save">透過PNGを作成</button></div><a id="download" download="sticker-v11.png">PNGを開く／保存する</a></section></div>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),N=512;let img=null,imgURL=null,blobURL=null,history=[],gesture=null,drag=null;const s={phrase:'ありがとう',layout:'vr',angle:0,size:50,style:'puffy',palette:'single',color:'#f5a4c6',color2:'#ffe08a',edge:3,gloss:true,scale:75,ix:0,iy:0,tx:0,ty:0,viewX:0,viewY:0,viewScale:1,target:'image'};let outputSize=512;const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));const snapshot=()=>({...s});function saveHistory(){history.push(snapshot());if(history.length>70)history.shift()}function undo(){if(!history.length)return;Object.assign(s,history.pop());sync();draw()}
const fonts={brush:'"Hiragino Mincho ProN","Yu Mincho",serif',plain:'"Hiragino Kaku Gothic ProN",sans-serif'};function font(){return (s.style==='brush'?'700 ':'900 ')+s.size+'px '+(fonts[s.style]||'"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif')}
function colors(i){const p=['#f5a4c6','#a5c9ff','#ffe39b','#b7e4bc','#d0b5ed','#ffbfaa'];if(s.palette==='single')return s.color;if(s.palette==='alternate')return i%2?s.color2:s.color;if(s.palette==='rainbow')return p[(i*2)%p.length];return p[i%p.length]}
function rect(){if(!img)return null;const r=Math.min(N/img.width,N/img.height)*s.scale/100;return {x:256+s.ix-img.width*r/2,y:256+s.iy-img.height*r/2,w:img.width*r,h:img.height*r}}
function textLayout(){ctx.font=font();const chars=Array.from(s.phrase),v=s.layout!=='h',step=s.size*1.12;const w=v?s.size*1.5:Math.max(1,ctx.measureText(s.phrase).width),h=v?chars.length*step:s.size*1.5;const base=s.layout==='vr'?{x:443,y:65}:s.layout==='vl'?{x:69,y:65}:{x:256,y:70};return{chars,v,step,w,h,x:base.x+s.tx,y:base.y+s.ty}}
function blend(hex,whiteAmount){const h=hex.replace('#','');const rgb=[0,2,4].map(i=>parseInt(h.slice(i,i+2),16));return '#'+rgb.map(v=>Math.round(v+(255-v)*whiteAmount).toString(16).padStart(2,'0')).join('')}
function shade(hex,amount){const h=hex.replace('#','');return '#'+[0,2,4].map(i=>Math.round(parseInt(h.slice(i,i+2),16)*(1-amount)).toString(16).padStart(2,'0')).join('')}
function drawText(){if(!s.phrase)return;const t=textLayout();ctx.save();ctx.translate(t.x,t.y);ctx.rotate(s.angle*Math.PI/180);ctx.font=font();ctx.textAlign='center';ctx.textBaseline='middle';const glyphs=t.v?t.chars.map(ch=>({ch,x:0,y:0})):t.chars.map(ch=>({ch,x:0,y:0}));if(t.v){glyphs.forEach((g,i)=>g.y=i*t.step)}else{let pos=-ctx.measureText(s.phrase).width/2;glyphs.forEach(g=>{const w=ctx.measureText(g.ch).width;g.x=pos+w/2;pos+=w})}
for(let i=0;i<glyphs.length;i++){
const g=glyphs[i],col=colors(i),isPuff=['puffy','candy'].includes(s.style);
const border=s.style==='outline'?Math.max(2,s.edge*1.8):isPuff?Math.max(2,s.edge*1.4):s.edge;
ctx.lineJoin='round';ctx.miterLimit=2;
if(border){ctx.strokeStyle=s.style==='outline'?'#ffffff':isPuff?shade(col,.28):'#ffffff';ctx.lineWidth=border*2;ctx.strokeText(g.ch,g.x,g.y)}
const doGloss=s.gloss&&isPuff;
if(doGloss){const grad=ctx.createLinearGradient(0,g.y-s.size*.52,0,g.y+s.size*.52);grad.addColorStop(0,blend(col,.24));grad.addColorStop(.30,blend(col,.12));grad.addColorStop(.52,col);grad.addColorStop(.85,shade(col,.10));grad.addColorStop(1,col);ctx.fillStyle=grad}else{ctx.fillStyle=col}
ctx.fillText(g.ch,g.x,g.y);
}
ctx.restore()}

function draw(){ctx.clearRect(0,0,N,N);const b=rect();if(b)ctx.drawImage(img,b.x,b.y,b.w,b.h);drawText();$('stage').style.transform='translate('+s.viewX+'px,'+s.viewY+'px) scale('+s.viewScale+')';$('status').textContent='512×512 PNG ／ 背景透過（元画像に背景があれば残ります）';$('toggleTarget').textContent='操作：'+({image:'イラスト',text:'文字',view:'画面全体'}[s.target]);$('undo').disabled=!history.length;if(blobURL){URL.revokeObjectURL(blobURL);blobURL=null;$('download').style.display='none'}}
function sync(){$('gloss').checked=s.gloss;$('quickSize').value=s.size;$('quickSizeOut').textContent=s.size;for(const id of ['phrase','layout','angle','size','style','palette','color','color2','edge','scale','target'])$(id).value=s[id];for(const [id,val] of [['angleOut',s.angle+'°'],['sizeOut',s.size],['scaleOut',s.scale+'%'],['edgeOut',s.edge]])$(id).textContent=val;draw()}
function change(fn){saveHistory();fn();sync()}
for(const id of ['phrase','layout','angle','size','style','palette','color','color2','edge','scale','target']){const el=$(id);el.addEventListener('input',()=>{if(gesture!==id){saveHistory();gesture=id}const val=el.value;s[id]=['angle','size','edge','scale'].includes(id)?Number(val):val;sync()});el.addEventListener('change',()=>gesture=null)}
$('gloss').addEventListener('change',e=>change(()=>{s.gloss=e.target.checked}));$('quickSize').addEventListener('input',e=>{s.size=Number(e.target.value);sync()});$('quickText').onclick=()=>change(()=>s.target='text');$('file').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;const url=URL.createObjectURL(f),next=new Image();next.onload=()=>{if(imgURL)URL.revokeObjectURL(imgURL);imgURL=url;img=next;history=[];s.ix=s.iy=0;sync()};next.onerror=()=>{URL.revokeObjectURL(url);alert('画像を読み込めませんでした')};next.src=url});
function tab(name){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('[id^=panel-]').forEach(p=>p.classList.toggle('hidden',p.id!=='panel-'+name))}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));$('selectImage').onclick=()=>change(()=>s.target='image');$('selectText').onclick=()=>change(()=>s.target='text');$('imageReset').onclick=()=>change(()=>{s.ix=s.iy=0});$('textReset').onclick=()=>change(()=>{s.tx=s.ty=0;s.angle=0});$('centerView').onclick=()=>change(()=>{s.viewX=s.viewY=0;s.viewScale=1});$('resetAll').onclick=()=>change(()=>{s.ix=s.iy=s.tx=s.ty=s.viewX=s.viewY=0;s.viewScale=1;s.angle=0});$('undo').onclick=undo;$('toggleTarget').onclick=()=>change(()=>{s.target={image:'text',text:'view',view:'image'}[s.target]});document.querySelectorAll('[data-nudge]').forEach(b=>b.onclick=()=>change(()=>{const [x,y]=b.dataset.nudge.split(',').map(Number);if(s.target==='image'){s.ix+=x;s.iy+=y}else if(s.target==='text'){s.tx+=x;s.ty+=y}else{s.viewX+=x;s.viewY+=y}}));
const pointers=new Map();let start=null;function xy(e){const r=$('stage').getBoundingClientRect();return{x:(e.clientX-r.left)*N/r.width,y:(e.clientY-r.top)*N/r.height}}function distance(a,b){return Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)}function centroid(a,b){return{x:(a.clientX+b.clientX)/2,y:(a.clientY+b.clientY)/2}}
const stage=$('stage');stage.addEventListener('pointerdown',e=>{e.preventDefault();stage.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});if(pointers.size===1){saveHistory();start={point:{x:e.clientX,y:e.clientY},mode:'one'}}else if(pointers.size===2){const [a,b]=[...pointers.values()];start={mode:'two',dist:distance(a,b),center:centroid(a,b),scale:s.scale,textSize:s.size,viewScale:s.viewScale,ix:s.ix,iy:s.iy,tx:s.tx,ty:s.ty,viewX:s.viewX,viewY:s.viewY}}});stage.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId)||!start)return;e.preventDefault();pointers.set(e.pointerId,{clientX:e.clientX,clientY:e.clientY});if(pointers.size===1&&start.mode==='one'){const dx=(e.clientX-start.point.x)*N/stage.clientWidth/s.viewScale,dy=(e.clientY-start.point.y)*N/stage.clientWidth/s.viewScale;start.point={x:e.clientX,y:e.clientY};if(s.target==='image'){s.ix+=dx;s.iy+=dy}else if(s.target==='text'){s.tx+=dx;s.ty+=dy}else{s.viewX+=e.movementX||dx*stage.clientWidth/N;s.viewY+=e.movementY||dy*stage.clientWidth/N}}else if(pointers.size===2&&start.mode==='two'){const [a,b]=[...pointers.values()],d=distance(a,b),c=centroid(a,b),ratio=clamp(d/Math.max(1,start.dist),.1,10),dx=(c.x-start.center.x)*N/stage.clientWidth/s.viewScale,dy=(c.y-start.center.y)*N/stage.clientWidth/s.viewScale;if(s.target==='image'){s.scale=clamp(start.scale*ratio,10,250);s.ix=start.ix+dx;s.iy=start.iy+dy}else if(s.target==='text'){s.size=Math.round(clamp(start.textSize*ratio,18,180));s.tx=start.tx+dx;s.ty=start.ty+dy}else{s.viewScale=clamp(start.viewScale*ratio,.5,3);s.viewX=start.viewX+c.x-start.center.x;s.viewY=start.viewY+c.y-start.center.y}}sync()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])stage.addEventListener(ev,e=>{pointers.delete(e.pointerId);start=null});
$('export').onclick=()=>{draw();const out=document.createElement('canvas');out.width=out.height=outputSize;const outctx=out.getContext('2d');outctx.imageSmoothingEnabled=true;outctx.imageSmoothingQuality='high';outctx.drawImage(canvas,0,0,outputSize,outputSize);out.toBlob(blob=>{if(!blob){alert('保存用PNGを作れませんでした');return}if(blobURL)URL.revokeObjectURL(blobURL);blobURL=URL.createObjectURL(blob);const a=$('download');a.href=blobURL;a.style.display='block';a.download='sticker-v11.png';a.textContent=outputSize+'×'+outputSize+' PNGを開く・保存（iPhoneでは共有→画像を保存）'},'image/png')};const colorNames={'ピンク':'#f5a4c6','赤':'#f07079','オレンジ':'#ffac65','黄色':'#ffe08a','緑':'#9bd5a3','水色':'#8bd8ed','青':'#87b5f8','紫':'#c5a2e9','黒':'#303039','白':'#ffffff'};
const styleNames={'ぷくぷく':'puffy','キャンディ':'candy','極太':'bold','パステル':'soft','縁取り':'outline','筆文字':'brush','シンプル':'plain'};
function commandFeedback(msg){$('commandResult').textContent=msg}
function runCommand(){const raw=$('command').value.trim().replace(/^／/,'/');if(!raw){commandFeedback('コマンドを入力してね。/ヘルプ で例を表示できます。');return}
const match=raw.match(/^\/(文字|画質|画像|配置|保存|ヘルプ)(?:\s+(.+))?$/);if(!match){commandFeedback('認識できません。例：/文字 ピンク 縦 80');return}
const kind=match[1],arg=(match[2]||'').trim();if(kind==='ヘルプ'){commandFeedback('使い方：/文字 ピンク 縦 80 ／ /文字 虹色 ぷくぷく ／ /画質 1024 ／ /画像 120 ／ /配置 文字 右 20 ／ /保存');return}
if(kind==='保存'){$('export').click();commandFeedback(outputSize+'pxの透過PNGを作成中。下の保存リンクを使ってね。');return}
if(kind==='画質'){const m=arg.match(/^(512|1024|2048)(?:\s*px)?$/i);if(!m){commandFeedback('画質は /画質 512、/画質 1024、/画質 2048 から選んでね。');return}outputSize=Number(m[1]);$('exportSize').value=String(outputSize);commandFeedback('保存サイズを'+outputSize+'×'+outputSize+'に設定したよ。元画像の細部は自動復元されません。');return}
if(kind==='画像'){const m=arg.match(/^(\d{1,3})\s*%?$/);if(!m||Number(m[1])<10||Number(m[1])>250){commandFeedback('画像の大きさは /画像 10〜250 で指定してね。');return}change(()=>{s.scale=Number(m[1]);s.target='image'});commandFeedback('イラストの大きさを'+s.scale+'%にしたよ。');return}
if(kind==='配置'){const m=arg.match(/^(文字|イラスト|画像|画面)\s+(右|左|上|下)\s+(\d{1,3})$/);if(!m){commandFeedback('例：/配置 文字 右 20、/配置 イラスト 上 30');return}const n=Number(m[3]);if(n>300){commandFeedback('移動量は0〜300で指定してね。');return}const dx=m[2]==='右'?n:m[2]==='左'?-n:0,dy=m[2]==='下'?n:m[2]==='上'?-n:0;change(()=>{if(m[1]==='文字'){s.tx+=dx;s.ty+=dy;s.target='text'}else if(m[1]==='画面'){s.viewX+=dx;s.viewY+=dy;s.target='view'}else{s.ix+=dx;s.iy+=dy;s.target='image'}});commandFeedback(m[1]+'を'+m[2]+'へ'+n+'動かしたよ。');return}
if(kind==='文字'){if(!arg){tab('text');commandFeedback('文字タブを開いたよ。例：/文字 ピンク 縦 80');return}let rest=arg,changed=[];const updates=[];
for(const [name,hex] of Object.entries(colorNames)){if(rest.includes(name)){updates.push(()=>{s.color=hex;s.palette='single'});rest=rest.replace(name,' ');changed.push(name);break}}
for(const [name,val] of Object.entries(styleNames)){if(rest.includes(name)){updates.push(()=>s.style=val);rest=rest.replace(name,' ');changed.push(name);break}}
for(const [word,palette] of [['虹色','rainbow'],['2色交互','alternate'],['交互','alternate'],['単色','single'],['一文字ずつ','pastel']]){if(rest.includes(word)){updates.push(()=>s.palette=palette);rest=rest.replace(word,' ');changed.push(word);break}}
for(const [word,val] of [['ツヤなし',false],['ツヤあり',true]]){if(rest.includes(word)){updates.push(()=>s.gloss=val);rest=rest.replace(word,' ');changed.push(word);break}}
for(const [word,val] of [['縦書き','vr'],['縦','vr'],['横書き','h'],['横','h']]){if(rest.includes(word)){updates.push(()=>s.layout=val);rest=rest.replace(word,' ');changed.push(word);break}}
const sizeMatch=rest.match(/(?:^|\s)(\d{2,3})(?:\s|$)/);if(sizeMatch){const n=Number(sizeMatch[1]);if(n>=18&&n<=180){updates.push(()=>s.size=n);rest=rest.replace(sizeMatch[0],' ');changed.push('サイズ'+n)}}
rest=rest.trim();if(rest){if(updates.length){commandFeedback('「'+rest+'」が残っています。文字そのものを変える場合は /文字 ありがとう のように入力してね。');return}if(rest.length>24){commandFeedback('文字は24文字以内にしてね。');return}updates.push(()=>s.phrase=rest);changed.push('表示文字「'+rest+'」')}
if(!updates.length){commandFeedback('例：/文字 ピンク 縦 80、/文字 虹色 ぷくぷく、/文字 おはよう');return}change(()=>updates.forEach(fn=>fn()));commandFeedback(changed.join('・')+'に変更したよ。');return}}
$('runCommand').onclick=runCommand;$('command').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();runCommand();$('command').blur()}});document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{$('command').value=b.dataset.example;runCommand()});$('exportSize').addEventListener('change',e=>{outputSize=Number(e.target.value)});
window.addEventListener('resize',()=>draw());sync();})();
</script></body></html>
