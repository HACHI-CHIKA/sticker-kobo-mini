<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>プロンプト図鑑 mini v14</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5fb;color:#283044;font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}header{background:white;padding:15px;position:sticky;top:0;z-index:2;box-shadow:0 1px 8px #0001}h1{font-size:19px;margin:0 0 5px}.small{font-size:12px;color:#667085}main{padding:12px;max-width:780px;margin:auto}button,select,input,textarea{font:inherit;border-radius:10px;border:1px solid #d5d8e4;padding:10px;background:white;color:#263248}button{cursor:pointer}button.primary{background:#2865bb;color:white;border:0;font-weight:700}.tabs{display:flex;gap:5px;margin-bottom:12px}.tabs button{flex:1;font-size:12px;padding:10px 4px}.tabs button.active{background:#2865bb;color:white}.panel{display:none}.panel.active{display:block}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{min-width:0;text-align:center;padding:7px 3px;border:2px solid transparent}.tile.selected{border-color:#2865bb;background:#eaf2ff}.tile svg{width:100%;height:auto;aspect-ratio:1}.tile span{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.box{background:white;padding:12px;border-radius:14px;margin-bottom:12px}.box h2{font-size:15px;margin:0 0 10px}.row{display:flex;gap:8px;align-items:center}.row>*{min-width:0;flex:1}.preview{width:min(100%,360px);display:block;margin:auto;border-radius:10px;background:repeating-conic-gradient(#e1e2e9 0 25%,#fff 0 50%) 50%/20px 20px}textarea{width:100%;min-height:105px;font-size:13px;resize:vertical}input,select{width:100%}label{display:block;font-size:12px;font-weight:700;margin:10px 0 5px}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.note{font-size:12px;line-height:1.65;color:#596477}#message{font-size:12px;color:#285eab;margin:8px 0;min-height:20px}@media(min-width:550px){.grid{grid-template-columns:repeat(5,minmax(0,1fr))}}</style></head><body><header><h1>プロンプト図鑑 mini <small>v14 試作</small></h1><div class="small">生成せずに、登録見本と文字の組み合わせを確認</div></header><main><div class="tabs"><button data-tab="illustration" class="active">イラスト20選</button><button data-tab="letter">文字20選</button><button data-tab="compose">組み合わせ</button><button data-tab="lookup">貼り付け検索</button></div><section id="illustration" class="panel active"><div class="box"><h2>イラストの見本を選ぶ</h2><div id="illustrations" class="grid"></div></div></section><section id="letter" class="panel"><div class="box"><h2>文字の見本を選ぶ</h2><label>見本に表示する言葉</label><input id="sampleText" value="ありがとう" maxlength="18"><div id="letters" class="grid" style="margin-top:10px"></div></div></section><section id="compose" class="panel"><div class="box"><h2>組み合わせプレビュー</h2><canvas id="canvas" class="preview" width="512" height="512"></canvas><div class="row"><div><label>表示文字</label><input id="phrase" value="ありがとう" maxlength="18"></div><div><label>文字方向</label><select id="direction"><option value="vertical">縦書き</option><option value="horizontal">横書き</option></select></div></div><div class="row"><div><label>文字サイズ</label><input id="size" type="range" min="24" max="95" value="55"></div><div><label>文字色</label><input id="color" type="color" value="#f39ac1"></div></div><div class="actions"><button id="copy" class="primary">プロンプトをコピー</button><button id="save">透過PNG保存</button></div><div id="message"></div><label>登録済みの組み合わせ用プロンプト</label><textarea id="prompt" readonly></textarea><p class="note">見本はブラウザ内で描くオリジナルの簡易図形です。AI生成結果の再現を保証するものではありません。PNGの市松模様は編集画面だけの表示で、保存画像には含まれません。</p></div></section><section id="lookup" class="panel"><div class="box"><h2>プロンプトを貼り付けて呼び出す</h2><p class="note">この図鑑に登録された ID（例：I-03 / T-07）を含むプロンプトを認識します。自由文から未知のイラストを生成する機能ではありません。</p><textarea id="search" placeholder="例：イラスト I-03、文字 T-07、表示文字 おはよう"></textarea><button id="find" class="primary" style="width:100%;margin-top:8px">登録見本を呼び出す</button><div id="searchResult" class="note" style="margin-top:10px"></div></div></section></main><script>(()=>{'use strict';const $=id=>document.getElementById(id),C=$('canvas'),ctx=C.getContext('2d');const names=['まるうさぎ','たれ耳うさぎ','まる猫','三角耳猫','しろ犬','たれ耳犬','こぐま','パンダ','きつね','ひよこ','ことり','かえる','ぶた','ハムスター','ひつじ','おばけ','ロボット','おにぎり','プリン','いちご'];const textStyles=['ぷくぷく桃','ぷくぷく空','ぷくぷく黄','ぷくぷく緑','ぷくぷく紫','キャンディ桃','キャンディ青','キャンディ橙','丸文字黒','丸文字白','太字ピンク','太字青','縁取り桃','縁取り黄','パステル虹','2色交互','やさしい筆風','すっきり細字','くっきり赤','シンプル黒'];const cols=['#f39ac1','#9cc9ff','#ffe09b','#b8dfb7','#cbb2e8','#f39ac1','#87bde9','#ffb577','#3c3c48','#ffffff','#ed83ac','#74a7ed','#f39ac1','#ffe09b','#f39ac1','#f39ac1','#a8757c','#8b8b9c','#e75d6c','#313141'];let chosenI=0,chosenT=0;const svg=(i)=>{let ears='',face='',acc='',body='#fff9f3',stroke='#69545b',eye='#43383c';if([0,1,6,7,13,14].includes(i))ears=i===1?'<path d="M34 38 Q10 10 19 5 Q36 4 46 38 M66 38 Q89 5 82 4 Q67 8 57 38" fill="#f3d7de" stroke="#69545b" stroke-width="3"/>':'<ellipse cx="32" cy="21" rx="12" ry="23" fill="#f3d7de" stroke="#69545b" stroke-width="3"/><ellipse cx="68" cy="21" rx="12" ry="23" fill="#f3d7de" stroke="#69545b" stroke-width="3"/>';if([2,3,4,5,8].includes(i))ears='<path d="M17 39 L22 9 L43 30 M57 30 L78 9 L83 39" fill="#e6bd8d" stroke="#69545b" stroke-width="3"/>';if(i===9||i===10)body='#ffe49a';if(i===11)body='#a7dfaa';if(i===12)body='#f5b9c7';if(i===15)body='#e9dff4';if(i===16)body='#c1d4e9';if(i===17)body='#f9f9f9';if(i===18)body='#ffe3a6';if(i===19)body='#f2a0ae';if(i===7)acc='<ellipse cx="31" cy="49" rx="14" ry="17" fill="#555"/><ellipse cx="69" cy="49" rx="14" ry="17" fill="#555"/>';if(i===14)acc='<path d="M22 35 Q10 12 30 20 Q39 5 50 20 Q63 5 71 20 Q92 15 78 36" fill="#f3e8df"/>';if(i===16)acc='<rect x="30" y="12" width="40" height="14" rx="4" fill="#8ea7be"/><path d="M50 12 V5" stroke="#69545b" stroke-width="3"/>';if(i===17)acc='<path d="M20 58 L50 14 L80 58" fill="#343a41"/>';if(i===18)acc='<path d="M22 38 Q50 7 78 38" fill="#efbd55"/>';if(i===19)acc='<path d="M50 25 Q42 9 31 14 M50 25 Q60 9 71 14" fill="none" stroke="#569c62" stroke-width="5"/>';face='<ellipse cx="36" cy="51" rx="4" ry="6" fill="'+eye+'"/><ellipse cx="64" cy="51" rx="4" ry="6" fill="'+eye+'"/><circle cx="25" cy="62" r="7" fill="#f7b6c5" opacity=".8"/><circle cx="75" cy="62" r="7" fill="#f7b6c5" opacity=".8"/><path d="M43 66 Q50 74 57 66" stroke="'+eye+'" stroke-width="2.5" fill="none" stroke-linecap="round"/>';return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">${ears}<ellipse cx="50" cy="56" rx="38" ry="35" fill="${body}" stroke="${stroke}" stroke-width="3"/>${acc}${face}</svg>`};const imageCache=[];names.forEach((_,i)=>{const im=new Image();im.onload=draw;im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg(i));imageCache.push(im)});function renderTiles(){ $('illustrations').innerHTML=names.map((n,i)=>`<button class="tile ${i===chosenI?'selected':''}" data-i="${i}">${svg(i)}<span>I-${String(i+1).padStart(2,'0')} ${n}</span></button>`).join('');$('letters').innerHTML=textStyles.map((n,i)=>`<button class="tile ${i===chosenT?'selected':''}" data-t="${i}"><div style="height:95px;display:flex;align-items:center;justify-content:center;background:#f5f5f8;border-radius:8px;color:${cols[i]};font-weight:${i===17?400:900};font-size:22px;line-height:1.1;text-shadow:${i>=12&&i<=15?'1px 2px #777':'none'}">${$('sampleText').value.replace(/[&<>"']/g,'')}</div><span>T-${String(i+1).padStart(2,'0')} ${n}</span></button>`).join('');document.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{chosenI=+b.dataset.i;renderTiles();draw();tab('compose')});document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{chosenT=+b.dataset.t;renderTiles();draw();tab('compose')})}function tab(name){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===name))}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));function prompt(){return `イラストID：I-${String(chosenI+1).padStart(2,'0')}（${names[chosenI]}）\n文字ID：T-${String(chosenT+1).padStart(2,'0')}（${textStyles[chosenT]}）\n表示文字：${$('phrase').value}\n文字方向：${$('direction').value==='vertical'?'縦書き':'横書き'}\n文字色：${$('color').value}\n文字サイズ：${$('size').value}\n背景：完全透過PNG。キャラクターと文字を重ねず、読みやすい余白を取る。上記の登録見本を参考に、可愛く仕上げる。`};function draw(){ctx.clearRect(0,0,512,512);const im=imageCache[chosenI];if(im?.complete&&im.naturalWidth)ctx.drawImage(im,48,90,340,340);let text=$('phrase').value||'',vertical=$('direction').value==='vertical',size=+$('size').value,col=chosenT===14?'#f39ac1':cols[chosenT];if(chosenT===0)col=$('color').value;ctx.font=`${chosenT===17?400:900} ${size}px ${chosenT===16?'serif':'sans-serif'}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';const chars=Array.from(text);ctx.save();if(vertical){const step=Math.min(size*1.04,440/Math.max(1,chars.length));const x=440;chars.forEach((ch,i)=>glyph(ch,x,55+i*step+step/2,i,col,true))}else{const width=ctx.measureText(text).width;const scale=Math.min(1,450/Math.max(1,width));ctx.translate(256,440);ctx.scale(scale,scale);let x=-width/2;chars.forEach((ch,i)=>{let w=ctx.measureText(ch).width;glyph(ch,x+w/2,0,i,col,false);x+=w})}ctx.restore();$('prompt').value=prompt()}function glyph(ch,x,y,i,col,vertical){ctx.save();ctx.translate(x,y);if(vertical&&/[ー－―〜～]/.test(ch))ctx.rotate(Math.PI/2);const color=chosenT===14?['#f39ac1','#9cc9ff','#ffe09b','#b8dfb7','#cbb2e8'][i%5]:chosenT===15?(i%2?'#9cc9ff':'#f39ac1'):col;ctx.lineWidth=chosenT>=12&&chosenT<=15?9:chosenT<8?5:2;ctx.strokeStyle=chosenT===9?'#53535c':'#fff';ctx.strokeText(ch,0,0);ctx.fillStyle=color;ctx.fillText(ch,0,0);ctx.restore()}for(const id of ['phrase','direction','size','color'])$(id).addEventListener('input',draw);$('sampleText').addEventListener('input',renderTiles);$('copy').onclick=async()=>{const p=prompt();try{await navigator.clipboard.writeText(p);$('message').textContent='プロンプトをコピーしたよ'}catch(e){$('prompt').focus();$('prompt').select();$('message').textContent='下の文章を選択してコピーしてね'}};$('save').onclick=()=>{const a=document.createElement('a');a.download='prompt-preview-v14.png';a.href=C.toDataURL('image/png');a.click();$('message').textContent='PNGを作成したよ。iPhoneのダウンロードを確認してね'};$('find').onclick=()=>{const t=$('search').value,im=t.match(/I[-－\s]?0?([1-9]|1\d|20)(?!\d)/i),tx=t.match(/T[-－\s]?0?([1-9]|1\d|20)(?!\d)/i);if(!im&&!tx){$('searchResult').textContent='登録IDが見つからないよ。I-01〜I-20、T-01〜T-20を含めてね。';return}if(im)chosenI=+im[1]-1;if(tx)chosenT=+tx[1]-1;const word=t.match(/表示文字[：:]\s*([^\n、]+)/);if(word)$('phrase').value=word[1].trim().slice(0,18);renderTiles();draw();$('searchResult').textContent='登録済みの見本を呼び出したよ。組み合わせタブで確認してね。';tab('compose')};renderTiles();draw()})();</script></body></html>
