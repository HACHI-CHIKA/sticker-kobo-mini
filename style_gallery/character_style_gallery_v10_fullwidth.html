<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf7fc"><title>キャラクター画風図鑑 mini｜選択・指示文対応版</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",sans-serif;color:#32283d;background:#faf7fc}*{box-sizing:border-box}body{margin:0}header{background:white;padding:18px 16px;border-bottom:1px solid #e8e1ed}header .wrap,main{max-width:1000px;margin:auto}h1{font-size:23px;margin:0 0 6px}header p{font-size:13px;color:#6d6474;line-height:1.6;margin:0 0 12px}input[type=search]{width:100%;border:1px solid #d8cce4;border-radius:10px;padding:12px;font-size:16px}main{padding:14px 14px 36px}.counter{font-size:13px;color:#746783;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.tile{background:white;border:2px solid transparent;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px #30203012;text-align:left;padding:0;cursor:pointer;color:inherit}.tile[aria-pressed=true]{border-color:#8064b5;box-shadow:0 0 0 2px #8064b51f}.tile img{display:block;width:100%;aspect-ratio:1;object-fit:contain;background:#f4f0f7}.tile .label{padding:10px}.tile strong{display:block;font-size:15px}.tile small{color:#796b89;font-size:12px}.detail{margin:18px 0 4px;background:#fff;border:1px solid #e6dced;border-radius:16px;padding:16px;scroll-margin-top:10px}.detail h2{font-size:20px;margin:0 0 6px}.detail p{font-size:13px;color:#6e6477;line-height:1.7}.selected{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}.selected img{width:110px;height:110px;object-fit:contain;border-radius:12px;background:#f5f2f7}.tag{display:inline-block;background:#eee7f8;color:#60488c;padding:5px 9px;border-radius:8px;font-size:13px;font-family:monospace}.section-title{font-weight:700;font-size:14px;margin:18px 0 7px}textarea{width:100%;min-height:235px;resize:vertical;border:1px solid #d7c9e2;border-radius:10px;background:#fcfaff;padding:12px;font-size:14px;line-height:1.7;color:#352c40}button.action{background:#7254aa;color:white;border:0;border-radius:10px;padding:13px;font-size:15px;font-weight:bold;width:100%;margin-top:10px}button.secondary{background:#f0eaf7;color:#584278}.note{font-size:12px;color:#746c7a;line-height:1.7}footer{padding:15px 0;font-size:12px;color:#746c7a;line-height:1.7}@media(min-width:680px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.selected{grid-template-columns:150px 1fr}.selected img{width:150px;height:150px}}[hidden]{display:none!important}.selected{display:flex;flex-direction:column;align-items:stretch;gap:12px}.selected img{width:100%;height:auto;aspect-ratio:3/4;max-height:650px;object-fit:contain;background:#f5f2f7}.selected>div{width:100%}textarea{min-height:125px;height:150px;max-height:260px}@media(min-width:680px){.selected{display:flex;flex-direction:column}.selected img{width:100%;height:auto;max-height:720px}}
</style><style>
/* 画像を画面幅いっぱいにし、画像→画風選択→プロンプトの順に配置 */
header{padding:12px 16px}header h1{font-size:20px}header p{margin:0;font-size:12px}
main{padding:0;max-width:none;width:100%}.detail{margin:0;padding:0;border:0;border-radius:0;background:transparent;scroll-margin-top:0}
.selected{display:flex;flex-direction:column;gap:0;width:100%}
.selected img{display:block;width:100vw;max-width:100%;height: min(125vw, 670px);min-height:380px;max-height:none;aspect-ratio:auto;object-fit:contain;background:#f5f2f7;border-radius:0;margin:0 auto}
.selected .style-meta{width:100%;padding:14px 16px 6px;background:white}
.style-meta h2{margin:0 0 6px;font-size:19px}.style-meta p{margin:8px 0 0}
.chooser{background:#fff;padding:8px 12px 18px;border-top:1px solid #eee6f4}
.chooser .section-title{margin:10px 4px 9px;font-size:16px}
.chooser input{margin-bottom:9px}.counter{margin:0 4px 10px}
.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tile{border-radius:10px}.tile img{aspect-ratio:1}.tile .label{padding:6px 3px;text-align:center}.tile strong{font-size:11px}.tile small{font-size:10px}
.prompt-area{padding:18px 14px 24px;background:#faf7fc}.prompt-area .section-title{font-size:16px;margin:0 0 8px}
textarea{height:145px;min-height:120px;max-height:260px}
footer{padding:14px 16px 28px}
@media(min-width:680px){.selected img{height:min(85vh,780px);width:100%;max-height:none}.chooser,.prompt-area,.style-meta{padding-left:max(20px,calc((100vw - 900px)/2));padding-right:max(20px,calc((100vw - 900px)/2))}.grid{grid-template-columns:repeat(6,minmax(0,1fr))}.tile strong{font-size:13px}}
</style></head><body><header><div class="wrap"><h1>🐰 キャラクター画風図鑑 mini</h1><p>画風をタップすると見本・特徴・詳しい指示文が表示されます。iPhoneで検索・コピーできます。</p></div></header><main><section class="detail" id="detail"><div class="selected"><img id="large" alt="選択中の画風見本"><div class="style-meta"><h2 id="styleName"></h2><span class="tag" id="styleCode"></span><p id="styleDesc"></p></div></div><div class="chooser"><div class="section-title">画像確認用・画風を選択</div><input id="search" type="search" placeholder="画風名・コマンドで検索" aria-label="画風を検索"><div class="counter" id="counter">19種類の画風</div><div class="grid" id="grid"></div></div><div class="prompt-area"><div class="section-title">画像を作るための詳しいプロンプト説明文</div><p class="note">元キャラクターの画像をChatGPTに添付し、下の文章をコピーして貼り付けてください。文章は編集できます。</p><textarea id="prompt" aria-label="生成用の詳しい指示文" spellcheck="false"></textarea><button class="action" id="copy">画像生成用プロンプトをコピー</button><button class="action secondary" id="copyCode">画風コマンドだけコピー</button><p class="note" id="status" aria-live="polite">文章はコピー前に自由に編集できます。</p></div></section><footer>※ 画風コマンドはこの図鑑内の分類ラベルです。コマンド単体では同じ画像の生成を保証しません。元画像を添付して詳しい指示文と一緒に使ってください。</footer></main><script>
const STYLES=[{"id": 1, "name": "ちびキャラ", "code": "/chibi", "description": "頭身を低く、頭と目を大きくした愛らしいデフォルメ", "image": "01_chibi.png"}, {"id": 2, "name": "ゆるかわ", "code": "/yurukawa", "description": "ゆるい手描き線と素朴でやさしい表情", "image": "02_yurukawa.png"}, {"id": 3, "name": "ぬいぐるみ", "code": "/plush", "description": "布の繊維、縫い目、柔らかな立体感", "image": "03_plush.png"}, {"id": 4, "name": "色鉛筆", "code": "/pencil", "description": "色鉛筆の細い線と紙に重なる優しい色", "image": "04_pencil.png"}, {"id": 5, "name": "水彩", "code": "/watercolor", "description": "透明水彩のにじみと淡い色の重なり", "image": "05_watercolor.png"}, {"id": 6, "name": "粘土", "code": "/clay", "description": "手で成形した粘土の丸みと微細な凹凸", "image": "06_clay_candidate.png"}, {"id": 7, "name": "アニメ", "code": "/anime", "description": "アニメのセル塗りと明快な輪郭", "image": "07_anime.png"}, {"id": 8, "name": "コミック", "code": "/comic", "description": "漫画のインク線とコミカルな表現", "image": "08_comic.png"}, {"id": 9, "name": "シンプル", "code": "/simple", "description": "形と色数を絞ったシンプルな図案", "image": "09_simple.png"}, {"id": 10, "name": "ドット絵", "code": "/pixel", "description": "小さな四角いピクセルで構成するレトロ表現", "image": "10_pixel.png"}, {"id": 11, "name": "3Dフィギュア", "code": "/3d", "description": "滑らかな立体造形と控えめな光沢", "image": "11_3d.png"}, {"id": 12, "name": "フェルト", "code": "/felt", "description": "羊毛フェルトの繊維とふっくらした形", "image": "12_felt.png"}, {"id": 13, "name": "ペーパークラフト", "code": "/paper", "description": "切り紙の重なりと紙の端の質感", "image": "13_paper.png"}, {"id": 14, "name": "刺繍", "code": "/embroidery", "description": "糸のステッチで形作る刺繍表現", "image": "14_embroidery.png"}, {"id": 15, "name": "編みぐるみ", "code": "/knit", "description": "毛糸の編み目が見える立体的な編みぐるみ", "image": "15_knit.png"}, {"id": 16, "name": "ガラス", "code": "/glass", "description": "透け感のあるガラス素材と反射", "image": "16_glass.png"}, {"id": 17, "name": "レジン", "code": "/resin", "description": "樹脂の透明感とぷっくりしたツヤ", "image": "17_resin.png"}, {"id": 18, "name": "ステンドグラス", "code": "/stainedglass", "description": "色ガラスの区切り線と透過光", "image": "18_stainedglass.png"}, {"id": 19, "name": "木彫り", "code": "/wood", "description": "木目と彫刻跡のある木彫り素材", "image": "19_wood.png"}];
const base='元画像に写る私のオリジナルキャラクターを参照して、同じキャラクターと分かるように保ちながら、指定した画風に変換した新しい画像を作成してください。顔の輪郭、目の形と色、耳の形・位置、口、頬、体型、手足、肉球、配色、表情など、キャラクターの識別に必要な特徴を優先して維持してください。顔・耳・体の白い部分は真っ白に保ち、陰影を別の体色として解釈しないでください。手足の本数や関節、左右の位置関係を自然にしてください。背景は完全透過PNGとし、白背景やチェック柄を描き込まないでください。キャラクター全体を画像内に収め、四辺に余白を確保してください。文字・ロゴ・余分な小物は追加しないでください。';
const grid=document.getElementById('grid'),prompt=document.getElementById('prompt'),detail=document.getElementById('detail');let selected=0;
STYLES.forEach((s,i)=>{const b=document.createElement('button');b.type='button';b.className='tile';b.dataset.q=(s.name+' '+s.code).toLowerCase();b.setAttribute('aria-pressed','false');const img=document.createElement('img');img.src=s.image;img.alt=s.name+'の画風見本';img.loading='lazy';const label=document.createElement('div');label.className='label';const strong=document.createElement('strong');strong.textContent=s.name;const small=document.createElement('small');small.textContent=s.code;label.append(strong,small);b.append(img,label);b.addEventListener('click',()=>select(i,true));grid.append(b)});
function select(i,scroll){selected=i;const s=STYLES[i];document.getElementById('large').src=s.image;document.getElementById('large').alt=s.name+'の見本';document.getElementById('styleName').textContent=s.name;document.getElementById('styleCode').textContent=s.code;document.getElementById('styleDesc').textContent=s.description;prompt.value=base+'\n\n【画風指定：'+s.name+'】\n'+s.description+'。この画風の質感・線・彩色を明確に表現しつつ、元キャラクターの特徴を損なわないようにしてください。\n\n【優先順位】\n1. 元キャラクターの同一性\n2. 指定画風の質感\n3. 背景の完全透過と余白\n4. 手足・耳・顔の自然さ';document.querySelectorAll('.tile').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));document.getElementById('status').textContent='文章はコピー前に自由に編集できます。';if(scroll)detail.scrollIntoView({behavior:'smooth',block:'start'})}
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();let n=0;document.querySelectorAll('.tile').forEach(b=>{b.hidden=!b.dataset.q.includes(q);if(!b.hidden)n++});document.getElementById('counter').textContent=n+' / '+STYLES.length+'種類を表示中'});
async function copy(t){let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const el=document.createElement('textarea');el.value=t;el.style.position='fixed';el.style.opacity='0';document.body.append(el);el.select();try{ok=document.execCommand('copy')}catch(e){}el.remove()}document.getElementById('status').textContent=ok?'コピーできました。貼り付けて使えます。':'コピーできない場合は、上の文章を長押しして「コピー」を選んでください。'}
document.getElementById('copy').addEventListener('click',()=>copy(prompt.value));document.getElementById('copyCode').addEventListener('click',()=>copy(STYLES[selected].code));select(0,false);
</script></body></html>
