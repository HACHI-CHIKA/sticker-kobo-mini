<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>スタンプ工房 mini v6</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f5f9;color:#202431;font-family:-apple-system,'Hiragino Kaku Gothic ProN',sans-serif}main{max-width:580px;margin:auto;padding:16px 14px 50px}h1{font-size:24px}.panel{background:#fff;border:1px solid #e2e5ec;border-radius:16px;padding:15px;margin:14px 0}label{display:block;font-weight:700;margin:12px 0 5px}input,select,button{font:inherit;width:100%;padding:10px;border:1px solid #cbd1dc;border-radius:9px;background:white}input[type=range]{padding:0}input[type=color]{height:45px}.cols,.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}.buttons{margin-top:10px}button{background:#eaf0ff;color:#234d99;font-weight:700;border:0}button.primary{background:#285bb8;color:white}button:disabled{opacity:.45}canvas{width:100%;aspect-ratio:1;display:block;touch-action:none;background:repeating-conic-gradient(#dfe1e7 0 25%,#fff 0 50%) 50%/22px 22px;border-radius:12px}small,p{line-height:1.6;color:#596272}#status{white-space:pre-line;font-size:13px;margin-top:10px}#download{display:none;padding:12px;text-align:center;background:#e7f5e9;border-radius:9px;margin-top:10px}
</style></head><body><main><h1>スタンプ工房 mini v6</h1><p>無料・iPhone対応。画像と文字をそれぞれ指で移動できます。画像処理は端末内で行います。</p>
<section class="panel"><label for="file">① 画像を選択</label><input type="file" id="file" accept="image/*"><small>透過PNG推奨。背景除去は未対応です。</small>
<label for="phrase">② 表示文字</label><input id="phrase" value="ありがとう" maxlength="24">
<div class="cols"><div><label for="layout">文字方向</label><select id="layout"><option value="vr">右・縦書き</option><option value="vl">左・縦書き</option><option value="ht">上・横書き</option><option value="hb">下・横書き</option></select></div><div><label for="font">フォント</label><select id="font"><option value="round">丸ゴシック風</option><option value="gothic">ゴシック</option><option value="mincho">明朝</option><option value="hand">手書き風</option></select></div></div>
<div class="cols"><div><label for="color">文字色</label><input id="color" type="color" value="#f17ca8"></div><div><label for="size">文字サイズ</label><input id="size" type="range" min="18" max="72" value="40"></div></div>
<label><input id="shine" type="checkbox" checked style="width:auto"> 控えめな文字ツヤ</label><label for="scale">③ 画像の大きさ</label><input id="scale" type="range" min="20" max="100" value="75"><small>端末に搭載された書体を使うため、フォントの見た目は機種によって異なります。</small></section>
<section class="panel"><div class="cols"><div><label for="target">指で動かす対象</label><select id="target"><option value="text">文字</option><option value="image">イラスト</option></select></div><div><label for="step">矢印の移動幅</label><select id="step"><option value="2">2px</option><option value="10" selected>10px</option><option value="25">25px</option></select></div></div>
<canvas id="canvas" width="512" height="512" aria-label="スタンプのプレビュー"></canvas><div id="status" role="status"></div>
<div class="buttons"><button id="up">↑ 上</button><button id="down">↓ 下</button><button id="left">← 左</button><button id="right">→ 右</button><button id="resetText">文字位置を戻す</button><button id="resetImage">画像位置を戻す</button><button id="undo">↶ 1つ戻す</button><button id="resetAll">全配置リセット</button><button id="export" class="primary" style="grid-column:1/-1">透過PNGを作成</button></div><a id="download" download="sticker-v6-512.png">PNGを保存する（タップ／長押し）</a>
<small>枠外に消えないよう移動を制限します。512×512は編集用サイズであり、LINE提出サイズではありません。AI生成・背景除去は未実装です。</small></section></main>
<script>(()=>{'use strict';const $=id=>document.getElementById(id),cv=$('canvas'),c=cv.getContext('2d'),N=512;
let img=null,url=null,outUrl=null,drag=null,history=[],editing=null;
let s={phrase:'ありがとう',layout:'vr',font:'round',color:'#f17ca8',size:40,scale:75,shine:true,tx:0,ty:0,ix:0,iy:0};
const keys=['phrase','layout','font','color','size','scale','shine'],clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),snap=()=>({...s});
function save(){history.push(snap());if(history.length>80)history.shift();}
function base(){return {vr:[450,58],vl:[62,58],ht:[256,65],hb:[256,445]}[s.layout];}
function font(){const f={round:'"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif',gothic:'"Hiragino Kaku Gothic ProN",sans-serif',mincho:'"Hiragino Mincho ProN","Yu Mincho",serif',hand:'"Hiragino Maru Gothic ProN",cursive'}[s.font];return (s.font==='mincho'?'700 ':'900 ')+s.size+'px '+f;}
function textBox(){c.font=font();const vertical=s.layout==='vr'||s.layout==='vl',chars=Array.from(s.phrase),step=s.size*1.1,w=vertical?s.size*1.25:Math.min(500,c.measureText(s.phrase).width+8),h=vertical?chars.length*step:s.size*1.4,b=base();return{x:b[0]+s.tx-w/2,y:b[1]+s.ty-(vertical?0:h/2),w,h,vertical,chars,step};}
function imageBox(){if(!img)return null;const r=Math.min(N/img.width,N/img.height)*s.scale/100,w=img.width*r,h=img.height*r;return{x:(N-w)/2+s.ix,y:(N-h)/2+s.iy,w,h};}
function limit(target){const b=target==='image'?imageBox():textBox();if(!b)return;const dx=clamp(b.x,4,Math.max(4,N-4-b.w))-b.x,dy=clamp(b.y,4,Math.max(4,N-4-b.h))-b.y;if(target==='image'){s.ix+=dx;s.iy+=dy;}else{s.tx+=dx;s.ty+=dy;}}
function render(){c.clearRect(0,0,N,N);const b=imageBox();if(b)c.drawImage(img,b.x,b.y,b.w,b.h);
const t=textBox();c.font=font();c.textAlign='center';c.textBaseline='middle';
function glyph(ch,x,y){c.fillStyle=s.color;c.fillText(ch,x,y,500);if(s.shine){c.save();c.globalAlpha=.3;c.fillStyle='#fff';c.fillText(ch,x-1,y-2,500);c.restore();}}
if(t.vertical)t.chars.forEach((ch,i)=>glyph(ch,t.x+t.w/2,t.y+s.size/2+i*t.step));else glyph(s.phrase,t.x+t.w/2,t.y+t.h/2);
const d=c.getImageData(0,0,N,N).data;let count=0,edge=false;for(let y=0;y<N;y++)for(let x=0;x<N;x++){const a=d[(y*N+x)*4+3];if(a>12){count++;if(x<16||x>495||y<16||y>495)edge=true;}}
const warn=[];if(!img)warn.push('画像未選択');if(img&&!img.hasAlpha)warn.push('元画像の透明領域が検出できません');if(edge)warn.push('余白が16px未満');if(t.h>N-8)warn.push('文字が長すぎる可能性があります');
$('status').textContent='512×512 PNG ／ 透明領域：約'+(100-count/N/N*100).toFixed(1)+'%'+(warn.length?'\n注意：'+warn.join(' ／ '):'\n簡易チェック：警告なし');$('undo').disabled=!history.length;}
function refresh(){if(outUrl){URL.revokeObjectURL(outUrl);outUrl=null;}$('download').style.display='none';render();}
function change(fn){save();fn();refresh();}
function sync(){for(const id of keys){const el=$(id);if(el.type==='checkbox')el.checked=s[id];else el.value=s[id];}}
keys.forEach(id=>{const el=$(id);el.addEventListener('input',()=>{if(editing!==id){save();editing=id;}s[id]=el.type==='checkbox'?el.checked:el.type==='range'?Number(el.value):el.value;if(id==='layout'){s.tx=s.ty=0;}if(['phrase','size','font','layout'].includes(id))limit('text');if(id==='scale')limit('image');refresh();});el.addEventListener('change',()=>editing=null);});
$('file').addEventListener('change',e=>{const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/')){alert('画像ファイルを選んでください');return;}const next=URL.createObjectURL(f),p=new Image();p.onload=()=>{if(url)URL.revokeObjectURL(url);url=next;img=p;const test=document.createElement('canvas');test.width=test.height=32;const tc=test.getContext('2d');tc.drawImage(p,0,0,32,32);const d=tc.getImageData(0,0,32,32).data;img.hasAlpha=false;for(let i=3;i<d.length;i+=4)if(d[i]<250){img.hasAlpha=true;break;}history=[];s.ix=s.iy=0;refresh();};p.onerror=()=>{URL.revokeObjectURL(next);alert('画像を読み込めません');};p.src=next;});
$('resetText').onclick=()=>change(()=>{s.tx=s.ty=0;limit('text');});$('resetImage').onclick=()=>change(()=>{s.ix=s.iy=0;});$('resetAll').onclick=()=>change(()=>{s.tx=s.ty=s.ix=s.iy=0;limit('text');});
$('undo').onclick=()=>{if(!history.length)return;s=history.pop();sync();refresh();};
for(const [id,dx,dy] of [['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]])$(id).onclick=()=>change(()=>{const n=Number($('step').value),target=$('target').value;if(target==='image'){s.ix+=dx*n;s.iy+=dy*n;}else{s.tx+=dx*n;s.ty+=dy*n;}limit(target);});
function point(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*N/r.width,y:(e.clientY-r.top)*N/r.height};}
cv.addEventListener('pointerdown',e=>{const target=$('target').value;if(target==='image'&&!img)return;save();drag={p:point(e),target};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!drag)return;const p=point(e),dx=p.x-drag.p.x,dy=p.y-drag.p.y;drag.p=p;if(drag.target==='image'){s.ix+=dx;s.iy+=dy;}else{s.tx+=dx;s.ty+=dy;}limit(drag.target);refresh();});
for(const ev of ['pointerup','pointercancel','lostpointercapture'])cv.addEventListener(ev,()=>drag=null);
$('export').onclick=()=>{render();cv.toBlob(blob=>{if(!blob){alert('PNGの作成に失敗しました');return;}if(outUrl)URL.revokeObjectURL(outUrl);outUrl=URL.createObjectURL(blob);const a=$('download');a.href=outUrl;a.style.display='block';},'image/png');};
render();})();</script></body></html>
